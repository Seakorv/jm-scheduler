[package]
name = "jmetro-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"

[[bench]]
name = "evaluate"
harness = false
